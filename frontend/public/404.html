<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KIRATECH IT Support</title>
  <script>
    // SPA deep-link fix for static hosts (Render, GitHub Pages, etc.)
    // When a user directly visits /admin/dashboard or refreshes a React route,
    // the static server can't find the file and serves this 404.html instead.
    // We save the intended path to sessionStorage then redirect to / so React
    // Router can take over. index.html reads the path back before mounting.
    (function () {
      var path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('__spa_path__', path);
      window.location.replace('/');
    })();
  </script>
</head>
<body></body>
</html>
